name: Nudibranch
services:
  web:
    # The ready-built app from GitHub. Set NUDIBRANCH_VERSION in .env (like 1.0.0) to stay on one release;
    # otherwise "latest". Working on the code itself? See docker-compose.dev.yml.
    image: ghcr.io/johnnywalker2020/nudibranch:${NUDIBRANCH_VERSION:-latest}
    container_name: nudibranch_app
    restart: unless-stopped
    ports:
      # This computer only by default. See BIND_ADDRESS in .env.example.
      - "${BIND_ADDRESS:-127.0.0.1}:8000:8000"
    volumes:
      # Your database, photos and backups. Everything else comes from the image.
      - ./data:/app/data
    environment:
      - DEBUG=0
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY:?Copy .env.example to .env and set DJANGO_SECRET_KEY}
      - ALLOWED_HOSTS=*
      - CSRF_TRUSTED_ORIGINS=${CSRF_TRUSTED_ORIGINS:-http://localhost:8000,http://127.0.0.1:8000}
      - DATA_DIR=/app/data
      - TIME_ZONE=${TIME_ZONE:-America/Regina}
      # Devices that log readings must send this key. Set it in .env.
      - API_SECRET_KEY=${API_SECRET_KEY:-}

  # Optional webcam relay (go2rtc): passes a camera on your home network (an old phone, an IP camera) to
  # Nudibranch, so you can watch it anywhere through Tailscale. To use it:
  #   1. Copy go2rtc.yaml to go2rtc.local.yaml (Git ignores that name) and add your camera there.
  #      Make the copy first: if go2rtc.local.yaml is missing, Docker makes an empty folder with that name.
  #   2. Uncomment the lines below and run: docker compose up -d
  #   go2rtc.yaml explains the rest (checking it, sharing it with Tailscale, adding it in Nudibranch).
  # go2rtc:
  #   image: alexxit/go2rtc:latest
  #   container_name: nudibranch_go2rtc
  #   restart: unless-stopped
  #   ports:
  #     - "127.0.0.1:1984:1984"  # this computer only: go2rtc's own page has no password
  #   volumes:
  #     - ./go2rtc.local.yaml:/config/go2rtc.yaml
