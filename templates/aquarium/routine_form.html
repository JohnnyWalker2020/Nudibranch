{% extends 'base.html' %}

{% block title %}Edit Routine | Nudibranch{% endblock %}

{% block content %}
<div class="max-w-xl mx-auto space-y-6">
  <div class="flex items-center gap-3">
    <a href="{% url 'routines' %}" class="p-2 rounded-xl bg-slate-900 border border-slate-800 text-slate-400 hover:text-white transition-colors" aria-label="Back">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/></svg>
    </a>
    <div>
      <h1 class="text-2xl font-black text-white tracking-tight">Edit Routine</h1>
      <p class="text-xs text-slate-400">{{ routine.title }}</p>
    </div>
  </div>

  <form method="POST" data-routine-form class="bg-slate-900 border border-slate-800 rounded-3xl p-6 sm:p-8 space-y-4 shadow-xl">
    {% csrf_token %}
    {% include 'aquarium/partials/routine_fields.html' %}
    <div class="flex items-center justify-end gap-3 pt-4 border-t border-slate-800">
      <a href="{% url 'routines' %}" class="px-5 py-3 rounded-xl text-sm font-semibold text-slate-400 hover:text-white transition-colors">Cancel</a>
      <button type="submit" class="px-6 py-3 bg-gradient-to-r from-cyan-500 to-blue-600 hover:from-cyan-400 hover:to-blue-500 text-white font-bold text-sm rounded-xl shadow-lg shadow-cyan-500/25 active:scale-95 transition-all">Save</button>
    </div>
  </form>
</div>
{% endblock %}
