<div class="bg-slate-900 border border-slate-800 rounded-2xl p-5 shadow-sm h-full">
  <div class="flex items-center justify-between mb-3">
    <h3 class="text-base font-bold text-white flex items-center gap-2"><span>⚡</span> Quick Measurements</h3>
    <span class="text-[11px] text-slate-500">Type a value, pick what it is</span>
  </div>

  <form method="POST" action="{% url 'quick_measure_create' %}">
    {% csrf_token %}
    <div id="qm-rows" class="space-y-2">
      <div class="qm-row grid grid-cols-[1fr_auto] gap-2">
        <input type="text" name="value" inputmode="decimal" autocomplete="off" placeholder="Value, e.g. 8.4"
               class="w-full px-4 py-2.5 bg-slate-950 border border-slate-800 rounded-xl text-white font-bold focus:outline-none focus:ring-2 focus:ring-cyan-500">
        <select name="parameter" class="px-3 py-2.5 bg-slate-950 border border-slate-800 rounded-xl text-white text-sm focus:outline-none focus:ring-2 focus:ring-cyan-500 max-w-[10.5rem]">
          {% for pt in parameter_types %}<option value="{{ pt.id }}">{{ pt.name }} ({{ pt.unit }})</option>{% endfor %}
        </select>
      </div>
    </div>
    <div class="mt-3 flex items-center justify-between gap-2">
      <button type="button" onclick="addQuickMeasureRow()" class="text-xs font-semibold text-cyan-400 hover:underline">+ Add another row</button>
      <button type="submit" class="px-4 py-2 bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-bold text-xs rounded-xl active:scale-95 transition-all">Save</button>
    </div>
  </form>
</div>
