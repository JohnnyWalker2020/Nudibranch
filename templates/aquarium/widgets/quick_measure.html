<div class="bg-slate-900 border border-slate-800 rounded-2xl p-5 shadow-sm h-full">
  <div class="flex items-center justify-between mb-3">
    <h3 class="text-base font-bold text-white flex items-center gap-2"><span>⚡</span> Quick Measurements</h3>
    <span class="text-[11px] text-slate-500">Pick it, type it, tap the unit to switch</span>
  </div>

  <form method="POST" action="{% url 'quick_measure_create' %}">
    {% csrf_token %}
    <div id="qm-rows" class="space-y-2">
      <div class="qm-row grid grid-cols-[minmax(0,1fr)_minmax(0,9rem)_auto] gap-2 items-center">
        <select name="parameter" aria-label="What you measured" onchange="quickMeasureParameter(this)"
                class="min-w-0 px-3 py-2.5 bg-slate-950 border border-slate-800 rounded-xl text-white text-sm focus:outline-none focus:ring-2 focus:ring-cyan-500">
          {% for pt in parameter_types %}<option value="{{ pt.id }}" data-units="{{ pt.unit_options }}" data-examples="{{ pt.unit_examples }}">{{ pt.name }}</option>{% endfor %}
        </select>
        <div class="unit-field !bg-slate-950 !border-slate-800">
          <input type="text" name="value" inputmode="decimal" autocomplete="off" aria-label="Value" class="font-bold">
          <button type="button" data-units="{{ parameter_types.0.unit_options|default:'-' }}" data-name="Unit" value="{{ parameter_types.0.unit|default:'' }}"
                  onchange="quickMeasureUnit(this)" class="unit-btn" {% if "," not in parameter_types.0.unit_options %}disabled{% endif %}>{{ parameter_types.0.unit }}</button>
          <input type="hidden" name="unit" value="{{ parameter_types.0.unit|default:'' }}">
        </div>
        <button type="button" onclick="removeQuickMeasureRow(this)" aria-label="Remove this row"
                class="qm-remove invisible px-1.5 text-slate-500 hover:text-rose-400 text-sm">✕</button>
      </div>
    </div>
    <div class="mt-3 flex items-center justify-between gap-2">
      <button type="button" onclick="addQuickMeasureRow()" class="text-xs font-semibold text-cyan-400 hover:underline">+ Measure something else</button>
      <button type="submit" class="px-4 py-2 bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-bold text-xs rounded-xl active:scale-95 transition-all">Save</button>
    </div>
    <p class="mt-2 text-[10px] text-slate-500">A reading in another unit is converted to the parameter's own unit when it's saved.</p>
  </form>
</div>
