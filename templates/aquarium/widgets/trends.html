<div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 sm:p-6 shadow-sm">
  <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 pb-4 border-b border-slate-800">
    <div>
      <h2 class="text-base font-bold text-white flex items-center gap-2"><span>📈</span> Parameter Trends</h2>
      <p id="trend-subtitle" class="text-xs text-slate-400">Last 30 days</p>
    </div>
    <div class="flex items-center gap-1.5 overflow-x-auto no-scrollbar py-1">
      <button type="button" onclick="loadChartData('all')" id="tab-all" data-code="all"
              class="chart-param-btn px-3 py-1.5 rounded-xl text-xs font-semibold whitespace-nowrap bg-slate-800 text-slate-300 hover:text-white hover:bg-slate-700 transition-colors">
        All
      </button>
      {% for pt in parameter_types %}
        <button type="button" onclick="loadChartData('{{ pt.code }}')" id="tab-{{ pt.code }}" data-code="{{ pt.code }}"
                class="chart-param-btn px-3 py-1.5 rounded-xl text-xs font-semibold whitespace-nowrap bg-slate-800 text-slate-300 hover:text-white hover:bg-slate-700 transition-colors">
          {{ pt.name }}
        </button>
      {% endfor %}
    </div>
  </div>
  <div class="relative h-64 sm:h-80 w-full mt-4"><canvas id="parameterChart"></canvas></div>
</div>
