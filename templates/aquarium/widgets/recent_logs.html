<div class="bg-slate-900 border border-slate-800 rounded-2xl p-5 shadow-sm space-y-4 h-full">
  <div class="flex items-center justify-between">
    <h3 class="text-base font-bold text-white flex items-center gap-2"><span>📋</span> Recent Test Logs</h3>
    <a href="{% url 'parameters' %}" class="text-xs font-semibold text-cyan-400 hover:underline">View All →</a>
  </div>
  <div id="recent-logs-list" class="space-y-2.5 max-h-[380px] overflow-y-auto no-scrollbar">
    {% for log in recent_logs %}
      {% include 'aquarium/partials/parameter_log_row.html' with log=log %}
    {% empty %}
      <div class="text-center py-10 text-slate-500 text-sm">
        No measurements recorded yet.<br>
        <button type="button" onclick="openQuickLogModal()" class="mt-2 text-cyan-400 font-semibold underline">Add your first test</button>
      </div>
    {% endfor %}
  </div>
</div>
