<!-- Start / +1 min and Stop / Reset for a timer card on the dashboard. -->
<button type="button" data-start class="t-setup w-full h-9 bg-gradient-to-r from-cyan-500 to-blue-600 hover:from-cyan-400 hover:to-blue-500 text-white font-black text-sm rounded-xl active:scale-95 transition-all">▶ Start</button>
<div data-running class="hidden grid grid-cols-2 gap-1.5">
  <button type="button" data-more class="h-9 bg-slate-800 hover:bg-slate-700 border border-slate-700 text-cyan-400 font-bold text-xs rounded-xl">+1 min</button>
  <button type="button" data-stop class="h-9 bg-slate-800 hover:bg-slate-700 border border-slate-700 text-rose-300 font-bold text-xs rounded-xl">Stop</button>
</div>
<button type="button" data-reset class="hidden w-full h-9 bg-slate-800 hover:bg-slate-700 border border-slate-700 text-white font-bold text-xs rounded-xl">Done · reset</button>
