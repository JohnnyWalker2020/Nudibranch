{% comment %}Folds or unfolds every card on the page that can fold. Needs `page` (the data-arrange name).{% endcomment %}
<button type="button" data-fold-all="{{ page }}" title="Fold every card down to its one-line summary, or open them all again" class="pill inline-flex items-center gap-1.5 px-3.5 py-2.5 bg-slate-900 hover:bg-slate-800 text-slate-300 hover:text-white border border-slate-800 rounded-xl font-semibold text-xs transition-colors">{% icon 'fold' %}<span data-fold-all-label>Fold all</span></button>
