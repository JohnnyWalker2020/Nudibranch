{% comment %}The fold button at the start of a card's title. The card also needs a [data-card-mini] line to fold down to. Needs `title`.{% endcomment %}
<button type="button" data-card-fold aria-expanded="true" title="Fold this card down to one line" aria-label="Fold {{ title }}" class="card-fold"><svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></button>
