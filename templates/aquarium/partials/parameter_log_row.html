<div id="log-entry-{{ log.id }}" class="flex items-center justify-between p-3.5 bg-slate-900 border border-slate-800 rounded-xl hover:border-slate-700 transition-colors animate-fade-in">
  <div class="flex items-center gap-3">
    <!-- Parameter Indicator Dot -->
    <div class="w-3 h-3 rounded-full shrink-0" style="background-color: {{ log.parameter_type.color }}"></div>
    <div>
      <div class="flex items-center gap-2">
        <span class="text-sm font-semibold text-white">{{ log.parameter_type.name }}</span>
        <span class="text-xs font-medium px-2 py-0.5 rounded-md border {{ log.status_color_class }}">
          {{ log.status|upper }}
        </span>
      </div>
      <p class="text-xs text-slate-400 mt-0.5">
        {{ log.measured_at|date:"M d, Y · g:i A" }}
        {% if log.notes %} · <span class="italic text-slate-300">{{ log.notes }}</span>{% endif %}
      </p>
    </div>
  </div>

  <div class="flex items-center gap-3">
    <div class="text-right">
      <span class="text-base font-bold text-white">{{ log.formatted_value }}</span>
      <span class="text-xs text-slate-400 ml-0.5">{{ log.parameter_type.unit }}</span>
    </div>
    <button hx-delete="{% url 'delete_log' log.id %}"
            hx-target="#log-entry-{{ log.id }}"
            hx-swap="outerHTML"
            hx-confirm="Delete this measurement?"
            class="text-slate-500 hover:text-rose-400 p-1.5 rounded-lg transition-colors"
            title="Delete entry">
      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>
    </button>
  </div>
</div>
