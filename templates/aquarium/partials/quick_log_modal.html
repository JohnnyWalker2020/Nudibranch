<!-- Quick Parameter Log Modal (plain POST, then back to the page you were on) -->
<div id="quick-log-modal" class="fixed inset-0 z-50 hidden items-end sm:items-center justify-center p-0 sm:p-4 bg-slate-950/80 backdrop-blur-sm">
  <div class="fixed inset-0" onclick="closeQuickLogModal()"></div>

  <div class="relative w-full max-w-lg bg-slate-900 border border-slate-800 rounded-t-3xl sm:rounded-2xl p-6 shadow-2xl z-10 max-h-[90vh] overflow-y-auto">
    <div class="flex items-center justify-between pb-4 border-b border-slate-800">
      <div>
        <h3 class="text-lg font-bold text-white">Log Parameter Reading</h3>
        {% if active_tank %}<p class="text-xs text-cyan-400">For {{ active_tank.name }}</p>{% endif %}
      </div>
      <button type="button" onclick="closeQuickLogModal()" class="p-1 rounded-lg text-slate-400 hover:text-white hover:bg-slate-800" aria-label="Close">✕</button>
    </div>

    <form method="POST" action="{% url 'quick_log_create' %}" class="mt-4 space-y-4">
      {% csrf_token %}
      <input type="hidden" name="next" value="{{ request.get_full_path }}">

      <div>
        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1.5">Parameter</label>
        {{ modal_form.parameter_type }}
      </div>
      <div>
        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1.5">Measured Value</label>
        {{ modal_form.value }}
      </div>
      <div>
        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1.5">Notes (Optional)</label>
        {{ modal_form.notes }}
      </div>
      <div>
        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1.5">Date &amp; Time <span class="normal-case text-slate-500">(blank = now)</span></label>
        {{ modal_form.measured_at }}
      </div>
      <div class="pt-2">
        <button type="submit" class="w-full py-3.5 bg-gradient-to-r from-cyan-500 to-blue-600 hover:from-cyan-400 hover:to-blue-500 text-white font-bold text-base rounded-xl shadow-lg shadow-cyan-500/25 active:scale-[0.98] transition-all">Save Measurement</button>
      </div>
    </form>
  </div>
</div>
