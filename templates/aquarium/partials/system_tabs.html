<!-- Sub-navigation for the tank pages. Pass active="tanks|equipment|dosing|routines|...". Phones show the main ones, plus More. -->
<div class="flex flex-wrap items-center gap-1.5 bg-slate-900/60 border border-slate-800/80 rounded-2xl p-1.5">
  <a href="{% url 'tanks' %}" class="px-3.5 py-1.5 rounded-xl text-xs font-semibold whitespace-nowrap transition-colors {% if active == 'tanks' %}bg-cyan-500 text-slate-950{% else %}text-slate-400 hover:text-white{% endif %}">🏛️ Tanks &amp; Sumps</a>
  <a href="{% url 'equipment' %}" class="px-3.5 py-1.5 rounded-xl text-xs font-semibold whitespace-nowrap transition-colors {% if active == 'equipment' %}bg-cyan-500 text-slate-950{% else %}text-slate-400 hover:text-white{% endif %}">⚙️ Equipment</a>
  <a href="{% url 'dosing' %}" class="px-3.5 py-1.5 rounded-xl text-xs font-semibold whitespace-nowrap transition-colors {% if active == 'dosing' %}bg-cyan-500 text-slate-950{% else %}text-slate-400 hover:text-white{% endif %}">🧪 Dosing &amp; ATO</a>
  <a href="{% url 'routines' %}" class="px-3.5 py-1.5 rounded-xl text-xs font-semibold whitespace-nowrap transition-colors {% if active == 'routines' %}bg-cyan-500 text-slate-950{% else %}text-slate-400 hover:text-white{% endif %}">📋 Routines</a>
  <a href="{% url 'tools' %}#salt-calculator" data-more-tab class="hidden md:inline-block px-3.5 py-1.5 rounded-xl text-xs font-semibold whitespace-nowrap transition-colors text-slate-400 hover:text-white">🧂 Salt Mix</a>
  <a href="{% url 'tools' %}#dose-estimator" data-more-tab class="hidden md:inline-block px-3.5 py-1.5 rounded-xl text-xs font-semibold whitespace-nowrap transition-colors text-slate-400 hover:text-white">🧮 Dose Estimator</a>
  <a href="{% url 'planner' %}" data-more-tab class="{% if active == 'planner' %}px-3.5 py-1.5 rounded-xl text-xs font-semibold whitespace-nowrap transition-colors bg-cyan-500 text-slate-950{% else %}hidden md:inline-block px-3.5 py-1.5 rounded-xl text-xs font-semibold whitespace-nowrap transition-colors text-slate-400 hover:text-white{% endif %}">🗺️ Planner</a>
  <a href="{% url 'wishlist' %}" data-more-tab class="{% if active == 'wishlist' %}px-3.5 py-1.5 rounded-xl text-xs font-semibold whitespace-nowrap transition-colors bg-cyan-500 text-slate-950{% else %}hidden md:inline-block px-3.5 py-1.5 rounded-xl text-xs font-semibold whitespace-nowrap transition-colors text-slate-400 hover:text-white{% endif %}">💜 Wishlist</a>
  <a href="{% url 'timers' %}" data-more-tab class="{% if active == 'timers' %}px-3.5 py-1.5 rounded-xl text-xs font-semibold whitespace-nowrap transition-colors bg-cyan-500 text-slate-950{% else %}hidden md:inline-block px-3.5 py-1.5 rounded-xl text-xs font-semibold whitespace-nowrap transition-colors text-slate-400 hover:text-white{% endif %}">⏱️ Fill Timers</a>
  <a href="{% url 'power' %}" data-more-tab class="{% if active == 'power' %}px-3.5 py-1.5 rounded-xl text-xs font-semibold whitespace-nowrap transition-colors bg-cyan-500 text-slate-950{% else %}hidden md:inline-block px-3.5 py-1.5 rounded-xl text-xs font-semibold whitespace-nowrap transition-colors text-slate-400 hover:text-white{% endif %}">⚡ Power</a>
  <a href="{% url 'tools' %}" data-more-tab class="{% if active == 'tools' %}px-3.5 py-1.5 rounded-xl text-xs font-semibold whitespace-nowrap transition-colors bg-cyan-500 text-slate-950{% else %}hidden md:inline-block px-3.5 py-1.5 rounded-xl text-xs font-semibold whitespace-nowrap transition-colors text-slate-400 hover:text-white{% endif %}">🧰 All Tools</a>
  <button type="button" aria-expanded="false" onclick="const open=this.getAttribute('aria-expanded')!=='true';this.setAttribute('aria-expanded',open);this.textContent=open?'Less':'More';this.parentElement.querySelectorAll('[data-more-tab]').forEach(t=>{if(!t.classList.contains('bg-cyan-500')){t.classList.toggle('hidden',!open);t.classList.toggle('inline-block',open);}});" class="md:hidden px-3.5 py-1.5 rounded-xl text-xs font-semibold whitespace-nowrap transition-colors text-slate-400 hover:text-white">More</button>
</div>
