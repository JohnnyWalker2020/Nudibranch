<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="nudi" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="rhinophores" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#fb7185"/>
    </linearGradient>
  </defs>
  <!-- Background rounded app icon -->
  <rect width="512" height="512" rx="110" fill="url(#bg)"/>
  
  <!-- Subtle water glow -->
  <circle cx="256" cy="256" r="180" fill="#0284c7" opacity="0.25"/>

  <!-- Stylized Nudibranch Body -->
  <path d="M 140 280 C 140 200, 240 180, 360 230 C 400 250, 420 280, 390 310 C 350 350, 210 380, 150 330 C 135 315, 140 295, 140 280 Z" fill="url(#nudi)"/>
  
  <!-- Cerata / Gills (feathered plumes on the back) -->
  <path d="M 240 210 Q 220 150 250 140 Q 270 180 260 210 Z" fill="#f43f5e"/>
  <path d="M 270 215 Q 260 140 290 135 Q 305 175 290 220 Z" fill="#ec4899"/>
  <path d="M 300 225 Q 300 155 330 150 Q 335 190 315 230 Z" fill="#fb7185"/>

  <!-- Rhinophores (Scent horns at front) -->
  <path d="M 165 240 Q 140 160 160 150 Q 175 180 180 240 Z" fill="url(#rhinophores)"/>
  <path d="M 190 245 Q 175 170 195 165 Q 205 195 200 245 Z" fill="url(#rhinophores)"/>
  
  <!-- Mantle margin accent border -->
  <path d="M 140 280 C 140 200, 240 180, 360 230 C 400 250, 420 280, 390 310 C 350 350, 210 380, 150 330 C 135 315, 140 295, 140 280 Z" fill="none" stroke="#67e8f9" stroke-width="8" opacity="0.7"/>

  <!-- Water drops / bubbles -->
  <circle cx="370" cy="140" r="14" fill="#38bdf8" opacity="0.6"/>
  <circle cx="400" cy="170" r="8" fill="#38bdf8" opacity="0.4"/>
  <circle cx="120" cy="360" r="10" fill="#38bdf8" opacity="0.5"/>
</svg>
