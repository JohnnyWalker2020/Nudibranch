<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="nt-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1a0e"/>
      <stop offset="100%" stop-color="#14381b"/>
    </linearGradient>
    <linearGradient id="turtle-skin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="100%" stop-color="#16a34a"/>
    </linearGradient>
    <linearGradient id="turtle-shell" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#854d0e"/>
      <stop offset="100%" stop-color="#451a03"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="110" fill="url(#nt-bg)"/>

  <!-- Ninja Turtle Shell on Nudibranch back -->
  <ellipse cx="290" cy="250" rx="95" ry="65" fill="url(#turtle-shell)" stroke="#ca8a04" stroke-width="4"/>
  <path d="M 240 250 L 340 250 M 290 200 L 290 300" stroke="#ca8a04" stroke-width="3" opacity="0.7"/>

  <!-- Crossed Ninja Swords / Katana Handles on Shell -->
  <line x1="210" y1="170" x2="370" y2="330" stroke="#94a3b8" stroke-width="8" stroke-linecap="round"/>
  <line x1="370" y1="170" x2="210" y2="330" stroke="#94a3b8" stroke-width="8" stroke-linecap="round"/>
  <circle cx="210" cy="170" r="8" fill="#e2e8f0"/>
  <circle cx="370" cy="170" r="8" fill="#e2e8f0"/>

  <!-- Nudibranch Green Body -->
  <path d="M 140 280 C 140 200, 240 190, 360 240 C 400 260, 420 280, 390 310 C 350 350, 210 380, 150 330 C 135 315, 140 295, 140 280 Z" fill="url(#turtle-skin)"/>

  <!-- Red Ninja Mask Bandana across head -->
  <path d="M 145 240 Q 180 255 215 250 L 210 275 Q 175 280 140 265 Z" fill="#dc2626"/>
  <!-- Fluttering Bandana Tails -->
  <path d="M 140 252 Q 105 245 95 230 Q 105 260 142 262 Z" fill="#dc2626"/>
  <path d="M 140 258 Q 110 270 95 285 Q 115 280 140 266 Z" fill="#b91c1c"/>

  <!-- Eyes behind mask slits -->
  <ellipse cx="165" cy="253" rx="7" ry="4" fill="#ffffff"/>
  <ellipse cx="190" cy="257" rx="7" ry="4" fill="#ffffff"/>
  <circle cx="165" cy="253" r="2.5" fill="#000000"/>
  <circle cx="190" cy="257" r="2.5" fill="#000000"/>

  <!-- Green Rhinophores -->
  <path d="M 165 235 Q 145 165 165 155 Q 180 185 180 235 Z" fill="#22c55e"/>
  <path d="M 190 240 Q 180 175 195 170 Q 205 195 200 240 Z" fill="#16a34a"/>
</svg>
