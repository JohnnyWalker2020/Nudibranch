  <!-- Hat Brim -->
  <ellipse cx="170" cy="235" rx="55" ry="14" fill="#312e81" stroke="#6366f1" stroke-width="2"/>
  <!-- Hat Gold Buckle -->
  <rect x="155" y="215" width="22" height="15" rx="3" fill="#eab308"/>
  <rect x="160" y="218" width="12" height="9" rx="1" fill="#1e1b4b"/>

  <!-- Glowing Potion Crystal Cerata -->
  <path d="M 250 210 Q 230 140 260 130 Q 280 170 270 210 Z" fill="#ec4899"/>
  <path d="M 285 215 Q 280 135 310 125 Q 320 175 305 220 Z" fill="#a855f7"/>
  <path d="M 320 225 Q 330 145 355 135 Q 355 185 335 230 Z" fill="#06b6d4"/>

  <!-- Magic Sparkles & Stars -->
  <circle cx="105" cy="180" r="4" fill="#fde047"/>
  <circle cx="280" cy="95" r="3" fill="#ec4899"/>
  <circle cx="240" cy="80" r="5" fill="#c084fc"/>
  <circle cx="330" cy="85" r="4" fill="#67e8f9"/>
</svg>
