<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="uni-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#4c1d95"/>
    </linearGradient>
    <linearGradient id="uni-body" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#fdf4ff"/>
      <stop offset="100%" stop-color="#fae8ff"/>
    </linearGradient>
    <linearGradient id="uni-horn" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="110" fill="url(#uni-bg)"/>

  <!-- Rainbow Cerata Plumes -->
  <path d="M 230 210 Q 210 130 240 120 Q 260 170 250 210 Z" fill="#f43f5e"/>
  <path d="M 260 215 Q 250 125 280 115 Q 295 165 280 220 Z" fill="#fb923c"/>
  <path d="M 290 220 Q 290 125 320 115 Q 330 165 310 225 Z" fill="#facc15"/>
  <path d="M 320 225 Q 330 135 355 125 Q 355 175 335 230 Z" fill="#4ade80"/>
  <path d="M 350 235 Q 370 145 390 140 Q 385 185 365 240 Z" fill="#38bdf8"/>

  <!-- Shimmering White Nudibranch Body -->
  <path d="M 140 280 C 140 200, 240 180, 360 230 C 400 250, 420 280, 390 310 C 350 350, 210 380, 150 330 C 135 315, 140 295, 140 280 Z" fill="url(#uni-body)" stroke="#f472b6" stroke-width="4"/>

  <!-- Golden Spiral Unicorn Horn -->
  <path d="M 145 235 L 120 110 L 165 220 Z" fill="url(#uni-horn)" stroke="#fef08a" stroke-width="2"/>
  <line x1="140" y1="210" x2="155" y2="200" stroke="#ca8a04" stroke-width="2"/>
  <line x1="135" y1="180" x2="148" y2="170" stroke="#ca8a04" stroke-width="2"/>
  <line x1="130" y1="150" x2="140" y2="140" stroke="#ca8a04" stroke-width="2"/>

  <!-- Cute anime closed eye -->
  <path d="M 170 260 Q 180 252 190 260" stroke="#db2777" stroke-width="3" fill="none" stroke-linecap="round"/>
  <!-- Blush -->
  <ellipse cx="180" cy="272" rx="8" ry="4" fill="#f472b6" opacity="0.6"/>

  <!-- Star Sparkles -->
  <polygon points="100,160 103,170 113,173 103,176 100,186 97,176 87,173 97,170" fill="#fef08a"/>
  <polygon points="210,130 212,137 219,139 212,141 210,148 208,141 201,139 208,137" fill="#f472b6"/>
  <polygon points="410,210 412,217 419,219 412,221 410,228 408,221 401,219 408,217" fill="#67e8f9"/>
</svg>
