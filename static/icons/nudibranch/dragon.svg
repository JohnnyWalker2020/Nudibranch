<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="dr-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c0707"/>
      <stop offset="100%" stop-color="#450a0a"/>
    </linearGradient>
    <linearGradient id="dr-body" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="50%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#7f1d1d"/>
    </linearGradient>
    <linearGradient id="dr-wings" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#b91c1c"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="110" fill="url(#dr-bg)"/>

  <!-- Dragon Wings spread behind -->
  <path d="M 270 230 Q 300 110 390 110 Q 350 160 380 180 Q 330 200 320 235 Z" fill="url(#dr-wings)" stroke="#f59e0b" stroke-width="3"/>
  <path d="M 230 240 Q 210 120 130 130 Q 170 175 150 195 Q 190 215 220 245 Z" fill="url(#dr-wings)" stroke="#f59e0b" stroke-width="3"/>

  <!-- Nudibranch Scaled Body -->
  <path d="M 140 280 C 140 200, 240 180, 360 230 C 400 250, 420 280, 390 310 C 350 350, 210 380, 150 330 C 135 315, 140 295, 140 280 Z" fill="url(#dr-body)"/>

  <!-- Fiery Dragon Cerata Spine -->
  <path d="M 240 210 Q 220 120 255 110 Q 275 160 260 210 Z" fill="#fbbf24"/>
  <path d="M 275 215 Q 270 115 305 105 Q 315 155 295 220 Z" fill="#f97316"/>
  <path d="M 310 225 Q 320 135 350 125 Q 345 175 325 230 Z" fill="#ef4444"/>

  <!-- Golden Horns (Rhinophores) -->
  <path d="M 160 240 Q 120 150 145 135 Q 170 170 175 240 Z" fill="#fbbf24"/>
  <path d="M 185 245 Q 165 160 190 145 Q 205 185 195 245 Z" fill="#f59e0b"/>

  <!-- Dragon Glowing Eye -->
  <circle cx="165" cy="265" r="5" fill="#fef08a"/>
  <ellipse cx="165" cy="265" rx="1.5" ry="4" fill="#000000"/>

  <!-- Fire ember sparks -->
  <circle cx="110" cy="280" r="5" fill="#fbbf24" opacity="0.8"/>
  <circle cx="95" cy="260" r="3" fill="#f97316" opacity="0.6"/>
  <circle cx="125" cy="305" r="4" fill="#ef4444" opacity="0.7"/>
</svg>
