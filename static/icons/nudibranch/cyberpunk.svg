<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="cp-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050510"/>
      <stop offset="100%" stop-color="#18002e"/>
    </linearGradient>
    <linearGradient id="cp-neon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="50%" stop-color="#ff007f"/>
      <stop offset="100%" stop-color="#7928ca"/>
    </linearGradient>
    <linearGradient id="cp-visor" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="100%" stop-color="#ff0055"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="110" fill="url(#cp-bg)"/>
  
  <!-- Cyberpunk grid lines -->
  <line x1="60" y1="380" x2="452" y2="380" stroke="#00f0ff" stroke-width="2" opacity="0.3"/>
  <line x1="90" y1="420" x2="422" y2="420" stroke="#ff007f" stroke-width="2" opacity="0.2"/>
  <line x1="120" y1="450" x2="392" y2="450" stroke="#00f0ff" stroke-width="1.5" opacity="0.2"/>

  <!-- Glowing circuit traces -->
  <path d="M 120 280 L 170 280 L 200 320 L 280 320 L 310 290 L 380 290" fill="none" stroke="#00f0ff" stroke-width="3" opacity="0.6"/>
  <circle cx="380" cy="290" r="4" fill="#00f0ff"/>

  <!-- Nudibranch Body -->
  <path d="M 140 280 C 140 200, 240 180, 360 230 C 400 250, 420 280, 390 310 C 350 350, 210 380, 150 330 C 135 315, 140 295, 140 280 Z" fill="url(#cp-neon)"/>
  
  <!-- Neon Cerata / Plumes -->
  <path d="M 240 210 Q 220 130 250 120 Q 270 170 260 210 Z" fill="#00f0ff"/>
  <path d="M 275 215 Q 265 125 295 115 Q 310 165 295 220 Z" fill="#ff007f"/>
  <path d="M 310 225 Q 315 140 345 130 Q 345 180 325 230 Z" fill="#ffff00"/>

  <!-- Cyber Visor Glasses -->
  <path d="M 150 240 L 210 255 L 205 275 L 145 260 Z" rx="4" fill="url(#cp-visor)"/>
  <line x1="148" y1="250" x2="208" y2="265" stroke="#ffffff" stroke-width="2" opacity="0.8"/>

  <!-- Antenna Rhinophores with LED tips -->
  <path d="M 165 240 Q 140 160 160 150 Q 175 180 180 240 Z" fill="#ff007f"/>
  <circle cx="160" cy="150" r="7" fill="#00f0ff"/>
  <path d="M 190 245 Q 175 170 195 165 Q 205 195 200 245 Z" fill="#ff007f"/>
  <circle cx="195" cy="165" r="7" fill="#00f0ff"/>
</svg>
