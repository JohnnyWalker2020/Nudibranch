<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="mk-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#3f3f46"/>
    </linearGradient>
    <linearGradient id="mk-steel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f4f4f5"/>
      <stop offset="50%" stop-color="#a1a1aa"/>
      <stop offset="100%" stop-color="#52525b"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="110" fill="url(#mk-bg)"/>

  <!-- Knight's Heraldic Shield behind body -->
  <path d="M 270 170 L 370 170 C 370 260, 320 310, 320 340 C 320 310, 270 260, 270 170 Z" fill="#991b1b" stroke="#eab308" stroke-width="4"/>
  <!-- Gold Cross on Shield -->
  <path d="M 320 170 L 320 330 M 275 220 L 365 220" stroke="#facc15" stroke-width="8"/>

  <!-- Nudibranch Body -->
  <path d="M 140 280 C 140 200, 240 180, 360 230 C 400 250, 420 280, 390 310 C 350 350, 210 380, 150 330 C 135 315, 140 295, 140 280 Z" fill="url(#mk-steel)"/>

  <!-- Knight Steel Helmet on Head -->
  <path d="M 130 230 Q 180 190 220 225 L 210 285 Q 160 300 130 280 Z" fill="#71717a" stroke="#d4d4d8" stroke-width="3"/>
  <!-- Helmet Visor Slit -->
  <rect x="145" y="245" width="55" height="6" rx="3" fill="#18181b"/>
  <!-- Visor Breathing Holes -->
  <circle cx="160" cy="265" r="2" fill="#18181b"/>
  <circle cx="170" cy="265" r="2" fill="#18181b"/>
  <circle cx="180" cy="265" r="2" fill="#18181b"/>
  <circle cx="165" cy="273" r="2" fill="#18181b"/>
  <circle cx="175" cy="273" r="2" fill="#18181b"/>

  <!-- Majestic Crimson Knight Feather Plume -->
  <path d="M 175 195 Q 160 110 130 115 Q 155 150 175 195 Z" fill="#dc2626"/>
  <path d="M 175 195 Q 185 100 160 95 Q 180 145 175 195 Z" fill="#ef4444"/>
  <path d="M 175 195 Q 210 115 190 110 Q 195 155 175 195 Z" fill="#b91c1c"/>

  <!-- Steel Halberd / Sword Tip -->
  <polygon points="120,290 95,210 110,215 125,290" fill="#e4e4e7" stroke="#71717a" stroke-width="1.5"/>
</svg>
