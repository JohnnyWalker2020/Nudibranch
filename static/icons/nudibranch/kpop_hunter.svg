<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="kp-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090514"/>
      <stop offset="100%" stop-color="#240c42"/>
    </linearGradient>
    <linearGradient id="kp-body" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2e1065"/>
      <stop offset="50%" stop-color="#4c1d95"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="kp-blade" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="110" fill="url(#kp-bg)"/>

  <!-- Demon Hunter Spirit Aura -->
  <path d="M 120 280 C 100 180, 260 140, 390 200 C 430 250, 420 340, 350 370 C 230 410, 130 350, 120 280 Z" fill="none" stroke="#a855f7" stroke-width="4" stroke-dasharray="10 5" opacity="0.6"/>

  <!-- Sleek Dark Hunter Nudibranch Body -->
  <path d="M 140 280 C 140 200, 240 180, 360 230 C 400 250, 420 280, 390 310 C 350 350, 210 380, 150 330 C 135 315, 140 295, 140 280 Z" fill="url(#kp-body)" stroke="#a855f7" stroke-width="3"/>

  <!-- Glowing Ghost Slayer Blades on Back -->
  <path d="M 235 220 Q 250 110 310 100 Q 285 160 265 220 Z" fill="url(#kp-blade)" stroke="#ffffff" stroke-width="2"/>
  <path d="M 280 230 Q 300 120 360 110 Q 330 170 310 230 Z" fill="url(#kp-blade)" stroke="#ffffff" stroke-width="2"/>

  <!-- Stylish K-Pop Demon Hunter Eye Patch / Mask -->
  <path d="M 145 250 L 195 245 L 205 270 L 155 275 Z" fill="#09090b" stroke="#06b6d4" stroke-width="2"/>
  <circle cx="175" cy="260" r="4" fill="#06b6d4"/>

  <!-- Neon Demon Seal Rhinophores -->
  <path d="M 160 235 Q 135 155 155 145 Q 170 175 175 235 Z" fill="#ec4899"/>
  <circle cx="155" cy="145" r="5" fill="#f43f5e"/>
  <path d="M 185 240 Q 170 165 190 155 Q 200 185 195 240 Z" fill="#ec4899"/>
  <circle cx="190" cy="155" r="5" fill="#f43f5e"/>

  <!-- Glowing purple energy glyphs -->
  <circle cx="95" cy="220" r="3" fill="#22d3ee"/>
  <circle cx="390" cy="280" r="4" fill="#c084fc"/>
  <circle cx="210" cy="95" r="3" fill="#ec4899"/>
</svg>
